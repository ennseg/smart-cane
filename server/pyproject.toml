[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cane-server"
version = "1.0.0"
description = "Сервер и Telegram-бот умной трости для незрячих"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24",
]

[tool.setuptools.packages.find]
include = ["cane_server*", "simulator*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF", "PL", "C4", "PIE", "RET"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "RUF001", "RUF002", "RUF003", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "PLR2004"]
"cane_server/bot/dry_run.py" = ["ASYNC109"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
